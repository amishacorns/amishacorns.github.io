# Yann LeCan't — sourced quotes and short rebuttals, grouped by the actual
# criticism rather than verdict badges. Keep quotes verbatim, dated, and linked
# to the best available source. The unpublished status field remains for
# internal curation only.

people:
  - name: "Yann LeCun"
    title: "Yann LeCan't"
    handle: "@ylecun"
    role: "Chief AI Scientist, Meta (2013–2025) · Turing Award, 2018"
    blurb: >-
      Yann LeCun repeatedly turns a limitation of the system in front of him
      into a limit on the whole field. The failure is not merely predictive.
      From a position of unusual influence, the same short horizons become an
      argument for postponing safety work while capabilities keep compounding.
    quotes:
      - text: |-
          Auto-Regressive LLMs can't plan (and can't really reason).
        source: "X (@ylecun)"
        url: "https://x.com/ylecun/status/1702027572077326505"
        date: "Sept 2023"
        section: "What LLMs Cannot Do"
        status: "Moving goalposts"
        note: ""

      - text: |-
          It seems to me that before "urgently figuring out how to control AI
          systems much smarter than us" we need to have the beginning of a
          hint of a design for a system smarter than a house cat.
        source: "X (@ylecun)"
        url: "https://x.com/ylecun/status/1791890883425570823"
        date: "May 2024"
        section: "Safety Can Wait"
        status: "Pending"
        note: "You build the vaccine platform before the pandemic. With compounding capabilities, waiting for the dangerous system to exist before learning how to control it is not caution. It is the absence of planning."

      - text: |-
          LLMs are useful, but they are an off ramp on the road to human-level
          AI. If you are a PhD student, don't work on LLMs.
        source: "X (@ylecun)"
        url: "https://x.com/ylecun/status/1796982509567180927"
        date: "June 2024"
        section: "What LLMs Cannot Do"
        status: "Wrong on arrival"
        note: "The current architecture can be temporary and still be the last one humans design unaided. If LLMs are sufficient to build the next paradigm, calling them an off-ramp misses the transition that matters."

      - text: |-
          [LLMs] can do none of those or they can only do them in a very
          primitive way, and they don't really understand the physical world.
        source: "Lex Fridman Podcast #416"
        url: "https://lexfridman.com/yann-lecun-3-transcript"
        date: "Mar 2024"
        section: "What LLMs Cannot Do"
        status: "Moving goalposts"
        note: ""

      - text: |-
          The shelf life of the current [LLM] paradigm is fairly short,
          probably three to five years.
        source: "Reported from Davos, via TechCrunch"
        url: "https://techcrunch.com/2025/01/23/metas-yann-lecun-predicts-a-new-ai-architectures-paradigm-within-5-years-and-decade-of-robotics/"
        date: "Jan 2025"
        section: "What LLMs Cannot Do"
        status: "Clock ticking"
        note: "This may be right and still miss the point. A paradigm only has to last long enough to build its successor. LLMs may be the final architecture humans have to invent alone."

      # --- Below 3 from the Jun 2026 thread. PERMALINKS NEEDED to make them
      # --- bulletproof (currently attributed but un-linked).
      - text: |-
          Economists say there won't be mass unemployment due to AI. Don't
          listen to Dario, he is not an economist.
        source: "X (@ylecun), Jun 2026 thread"
        url: ""
        date: "Jun 2026"
        section: "Economic Denial"
        status: "Clock ticking"
        note: "An appeal to credentials is not an argument. The live question is whether economists are extrapolating from ordinary technological change while AI automates the work that produces the next technological change."

      - context: >-
          Replying to a claim that "AI is going to replace grad students just
          as it has replaced private sector coders and researchers."
        text: |-
          No it won't. And no, it hasn't.
        source: "X (@ylecun)"
        url: ""
        date: "Jun 2026"
        section: "Economic Denial"
        status: "Clock ticking"
        note: "The categorical no is the claim. Software agents do not need to replace every researcher before they replace large parts of what junior researchers are paid to do."

      - text: |-
          LLMs have changed the world (I never said otherwise). But they are
          not a means to achieve human-level intelligence or even animal-level.
        source: "X (@ylecun), Jun 2026 thread"
        url: ""
        date: "Jun 2026"
        section: "What LLMs Cannot Do"
        status: "Pending"
        note: >-
          What he can't seem to grasp: the LLMs will build the next
          architecture. That makes this the last architecture we design by
          hand — the opposite of a dead end.


      # --- Deep-dive candidates, Jul 2026 ---
      - text: |-
          AI systems are not weapons any more than a car or a computer is a weapon.
        source: "Facebook"
        url: "https://www.facebook.com/yann.lecun/posts/pfbid0SjyAxQpYmJrF9dL6uBkwRA25vn9bUNnCYPYaym5oDgzg54RQpNCEK4nY4tLiNx1tl/?comment_id=330366236204472"
        date: "Oct 2023"
        section: "Safety Can Wait"
        status: "Hot take"
        note: "This is the guns-don’t-kill-people argument applied to a general-purpose system that can write code, discover vulnerabilities, operate machines, persuade people, and eventually improve itself. “General purpose” does not mean “incapable of becoming a weapon.”"

      - text: |-
          Until we have a design, it's premature to speculate about ways to make them safe.
        source: "Facebook"
        url: "https://www.facebook.com/yann.lecun/posts/pfbid0SjyAxQpYmJrF9dL6uBkwRA25vn9bUNnCYPYaym5oDgzg54RQpNCEK4nY4tLiNx1tl/?comment_id=330366236204472"
        date: "Oct 2023"
        section: "Safety Can Wait"
        status: "Hot take"
        note: "You do not wait for a pandemic to discover how vaccines work. Safety research shapes the architecture before the failure mode exists, especially when the underlying capability is compounding."

      - text: |-
          It retrieves it because it's accumulated a lot of knowledge.
        context: "Describing how an LLM produces an answer."
        source: "Lex Fridman Podcast #416"
        url: "https://lexfridman.com/yann-lecun-3-transcript/"
        date: "Mar 2024"
        section: "What LLMs Cannot Do"
        status: "Wrong on arrival"
        note: "Retrieval is not an adequate description of systems that construct proofs, plans, programs, and novel tool trajectories at inference time."

      - text: |-
          You're not going to be able to do this with generative models.
        context: "On building useful predictive world models."
        source: "Lex Fridman Podcast #416"
        url: "https://lexfridman.com/yann-lecun-3-transcript/"
        date: "Mar 2024"
        section: "What LLMs Cannot Do"
        status: "Clock ticking"
        note: "A clean, falsifiable architecture claim. Generative video and action models now get to run the experiment."

      - text: |-
          My benevolent defensive AI will be better at destroying your evil AI than your evil AI will be at hurting humans.
        source: "X (@ylecun)"
        url: "https://x.com/ylecun/status/1637849935252172801"
        date: "Mar 2023"
        section: "Safety Can Wait"
        status: "Hot take"
        note: "The AI-police answer assumes the defensive system wins, stays defensive, recognizes the threat, and arrives on time."

      - text: |-
          AI systems, as smart as they might be, will be subservient to us.
        source: "TIME interview"
        url: "https://time.com/6694432/yann-lecun-meta-ai-interview/"
        date: "Feb 2024"
        section: "Safety Can Wait"
        status: "Pending"
        note: "This is a conclusion presented as an architectural default."

      - text: |-
          So basically, they can't invent new things.
        context: "On the limits of current AI systems."
        source: "TIME interview"
        url: "https://time.com/6694432/yann-lecun-meta-ai-interview/"
        date: "Feb 2024"
        section: "What LLMs Cannot Do"
        status: "Empirically false"
        note: "By 2026, systems routinely generate novel software, proofs, designs, strategies, and scientific hypotheses. The interesting argument is now about degree."

  - name: "Gary Marcus"
    title: "Gary Marcus"
    handle: "@GaryMarcus"
    role: "Scientist, author, and longtime deep-learning critic"
    blurb: >-
      The wall keeps moving. The criticism is often worth reading; the
      confidence that scaling has reached its limit is what belongs here.
    quotes:
      - text: |-
          Deep Learning Is Hitting a Wall
        source: "Nautilus"
        url: "https://nautil.us/deep-learning-is-hitting-a-wall-238440"
        date: "Mar 2022"
        section: "The Scaling Wall"
        status: "Wrong on arrival"
        note: "Published eight months before ChatGPT."

      - text: |-
          We may already be running into scaling limits in deep learning.
        source: "Nautilus"
        url: "https://nautil.us/deep-learning-is-hitting-a-wall-238440"
        date: "Mar 2022"
        section: "The Scaling Wall"
        status: "Wrong on arrival"
        note: "The following four years produced the largest capability jump in the history of the field."

      - text: |-
          Deep learning is hitting a stubbornly resilient wall.
        context: "From the abstract of a coauthored paper on o3 and compositional reasoning."
        source: "Murphy et al., arXiv:2502.10934"
        url: "https://arxiv.org/abs/2502.10934"
        date: "Feb 2025"
        section: "The Scaling Wall"
        status: "Clock ticking"
        note: "A wall is a strong claim. A benchmark miss is evidence of a limitation, not evidence that the limitation cannot be scaled or engineered away."

  - name: "François Chollet"
    title: "François Chollet"
    handle: "@fchollet"
    role: "Creator of Keras and ARC-AGI"
    blurb: >-
      He built one of the field's best tests of adaptation. The leap from a
      model failing that test to a universal theory of deep learning is the
      part under examination.
    quotes:
      - text: |-
          LLMs are fetching memorized programs that map to the current prompt.
        source: "ARC Prize"
        url: "https://arcprize.org/blog/beat-arc-agi-deep-learning-and-program-synthesis"
        date: "Oct 2024"
        section: "Memorization and Novelty"
        status: "Hot take"
        note: "A crisp claim, and increasingly difficult to reconcile with long-horizon agentic behavior on novel tasks."

      - text: |-
          It cannot adapt to the slightest amount of novelty.
        context: "His stated hypothesis about LLMs."
        source: "ARC Prize"
        url: "https://arcprize.org/blog/beat-arc-agi-deep-learning-and-program-synthesis"
        date: "Oct 2024"
        section: "Memorization and Novelty"
        status: "Empirically false"
        note: "The word slightest is doing heroic work here."

      - text: |-
          This is an intrinsic limitation of the curve-fitting paradigm. Of all deep learning.
        source: "ARC Prize"
        url: "https://arcprize.org/blog/beat-arc-agi-deep-learning-and-program-synthesis"
        date: "Oct 2024"
        section: "Memorization and Novelty"
        status: "Clock ticking"
        note: "This turns an empirical observation about current systems into a claim about an entire paradigm."

  - name: "Andrew Ng"
    title: "Andrew Ng"
    handle: "@AndrewYNg"
    role: "Founder, DeepLearning.AI · Founding lead, Google Brain"
    blurb: >-
      The sunny case for acceleration: progress will be gradual, alignment
      tools are stronger than the public realizes, and the safest speed is
      faster. Each clause is now an experiment.
    quotes:
      - text: |-
          Maybe 50. I think it's decades out.
        context: "Asked whether AGI was 30 or 40 years away."
        source: "Strange Loop podcast"
        url: "https://sanalabs.com/strange-loop/andrew-ng"
        date: "2023"
        section: "Timelines"
        status: "Clock ticking"
        note: "The useful receipt is the horizon, not a semantic fight over the definition of AGI."

      - text: |-
          Technology doesn't work like that; it advances slowly.
        context: "Rejecting a hard-takeoff scenario."
        source: "Strange Loop podcast"
        url: "https://sanalabs.com/strange-loop/andrew-ng"
        date: "2023"
        section: "Timelines"
        status: "Clock ticking"
        note: "Software that automates AI research is exactly where ordinary intuitions about technological speed may fail."

      - text: |-
          Let's make AI go as fast as possible.
        source: "Strange Loop podcast"
        url: "https://sanalabs.com/strange-loop/andrew-ng"
        date: "2023"
        section: "Safety and Acceleration"
        status: "Hot take"
        note: "Speed is not a safety argument."

      - text: |-
          I actually spoke with quite a few people about the existential risk, and candidly, I don't get it.
        source: "World Economic Forum AI Governance Summit"
        url: "https://www.weforum.org/podcasts/agenda-dialogues/episodes/ai-governance-summit-2023-state-of-gen-ai-views-from-the-frontier/"
        date: "Nov 2023"
        section: "Safety and Acceleration"
        status: "Hot take"
        note: "Not understanding a risk argument does not lower the probability of the risk."

      - text: |-
          We have better tools, more powerful, than the public probably appreciates for just telling the AI to do what we want.
        source: "World Economic Forum AI Governance Summit"
        url: "https://www.weforum.org/podcasts/agenda-dialogues/episodes/ai-governance-summit-2023-state-of-gen-ai-views-from-the-frontier/"
        date: "Nov 2023"
        section: "Safety and Acceleration"
        status: "Clock ticking"
        note: "Getting a chatbot to refuse a request is not the same problem as controlling a more capable agent pursuing a long-horizon objective."

  - name: "Jensen Huang"
    title: "Jensen Huang"
    handle: "@nvidia"
    role: "Founder and CEO, NVIDIA"
    blurb: >-
      Jensen Huang's position matters twice: he influences policy, and NVIDIA
      sells the infrastructure behind the AI buildout. Neither fact makes him
      wrong. Both raise the cost of dismissing existential and employment risks
      as "complete nonsense" without doing the argument.
    quotes:
      - text: |-
          I think we've done a lot of damage with very well-respected people
          who have painted a doomer narrative.
        source: "No Priors podcast"
        url: "https://podcasts.apple.com/us/podcast/nvidias-jensen-huang-on-reasoning-models-robotics-and/id1668002688?i=1000744277967"
        date: "Jan 2026"
        section: "Safety Dismissal"
        status: "Hot take"
        note: "The same interview describes AI compute gains as compounding five to ten times per year, then assumes cheaper monitoring AIs will reverse the danger. He sees the exponential. He simply assumes the defense scales better."

      - text: |-
          The fact that this is going to be the end of humanity, it's
          complete nonsense.
        source: "Axios, Behind the Curtain"
        url: "https://www.axios.com/2026/07/23/axios-interview-jensen-huang-is-ais-anti-doom-evangelist"
        date: "Jul 2026"
        section: "Safety Dismissal"
        status: "Hot take"
        note: "A probability is not refuted by incredulity. From one of the people most able to shape AI policy, “complete nonsense” is not analysis."

      - text: |-
          People talk about AI reducing jobs, complete nonsense.
        source: "NVIDIA GTC Taipei keynote"
        url: "https://www.nvidia.com/en-us/on-demand/session/gtctaipei26-stw61044/"
        date: "Jun 2026"
        section: "Economic Denial"
        status: "Clock ticking"
        note: "Higher demand for software today does not settle what happens when the software begins performing an increasing share of the work, including the work that improves the software."
