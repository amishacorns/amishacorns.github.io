<svg xmlns="http://www.w3.org/2000/svg" width="340" height="640" viewBox="0 0 340 640" role="img" aria-labelledby="title desc">
  <title id="title">A PhD Spans Five AI Generations</title>
  <desc id="desc">A mobile chart normalizing AI capability per dollar to one in 2023, extending the reported tenfold annual cost trend to ten thousand in 2027, and comparing three scenarios through 2032.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101014"/><stop offset="1" stop-color="#070708"/></linearGradient>
    <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.title{fill:#f8fafc;font-size:20px;font-weight:600}.sub{fill:#94a3b8;font-size:11px}.axis{fill:#94a3b8;font-size:11px}.year{fill:#cbd5e1;font-size:11px;text-anchor:middle}.label{fill:#f8fafc;font-size:11px;font-weight:600}.value{fill:#f8fafc;font-size:15px;font-weight:600}.note{fill:#94a3b8;font-size:11px}.grid{stroke:#fff;stroke-opacity:.1}.historical{stroke:#a78bfa;stroke-width:3;fill:none}.continued{stroke:#a78bfa;stroke-width:2;fill:none;stroke-dasharray:6 4}.slowing{stroke:#f8fafc;stroke-opacity:.8;stroke-width:2;fill:none}.plateau{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:3 4}.human{stroke:#f8fafc;stroke-opacity:.8;stroke-width:2;fill:none}</style>
  </defs>
  <rect x="1" y="1" width="338" height="638" rx="20" fill="url(#bg)" stroke="#fff" stroke-opacity=".12"/>
  <text x="24" y="40" class="title">A PhD Spans Five</text>
  <text x="24" y="64" class="title">AI Generations</text>
  <text x="24" y="89" class="sub">AI indexed to 1× in 2023; a human researcher</text>
  <text x="24" y="105" class="sub">is assumed to be 100K×.</text>

  <text x="15" y="285" class="axis" text-anchor="middle" transform="rotate(-90 15 285)">Capability Per Dollar (2023 AI = 1×)</text>
  <rect x="65" y="150" width="251" height="270" fill="none" stroke="#fff" stroke-opacity=".16"/>
  <g class="grid"><line x1="65" y1="420" x2="316" y2="420"/><line x1="65" y1="360" x2="316" y2="360"/><line x1="65" y1="300" x2="316" y2="300"/><line x1="65" y1="240" x2="316" y2="240"/><line x1="65" y1="180" x2="316" y2="180"/><line x1="65" y1="150" x2="316" y2="150"/></g>
  <g class="axis" text-anchor="end"><text x="58" y="424">1×</text><text x="58" y="364">100×</text><text x="58" y="304">10K×</text><text x="58" y="244">1M×</text><text x="58" y="184">100M×</text><text x="58" y="154">1B×</text></g>

  <line x1="176" y1="150" x2="176" y2="420" stroke="#fff" stroke-opacity=".22"/>
  <path d="M72 420 L98 390 L124 360" class="historical"/>
  <path d="M124 360 L150 330 L176 300" class="continued"/>
  <path d="M176 300 L202 270 L228 240 L254 210 L280 180 L310 150" class="continued"/>
  <path d="M176 300 L202 279 L228 261 L254 247 L280 238 L310 232" class="slowing"/>
  <path d="M176 300 L202 300 L228 300 L254 300 L280 300 L310 300" class="plateau"/>
  <path d="M72 270 L310 270" class="human"/>
  <text x="72" y="255" class="label">Human Researcher · 100K×</text>
  <g fill="#a78bfa"><circle cx="72" cy="420" r="3"/><circle cx="98" cy="390" r="3"/><circle cx="124" cy="360" r="3"/></g>
  <g fill="#0b0b0e" stroke="#a78bfa" stroke-width="2"><circle cx="150" cy="330" r="3"/><circle cx="176" cy="300" r="3"/></g>

  <g class="year"><text x="72" y="438">23</text><text x="98" y="438">24</text><text x="124" y="438">25</text><text x="150" y="438">26</text><text x="176" y="438">27</text><text x="202" y="438">28</text><text x="228" y="438">29</text><text x="254" y="438">30</text><text x="280" y="438">31</text><text x="310" y="438">32</text></g>

  <line x1="24" y1="466" x2="316" y2="466" stroke="#fff" stroke-opacity=".12"/>
  <text x="24" y="493" class="value">2032 Scenarios</text>
  <line x1="24" y1="516" x2="54" y2="516" class="continued"/><text x="66" y="520" class="label">Historical Pace</text><text x="316" y="520" class="label" text-anchor="end">1B×</text>
  <line x1="24" y1="542" x2="54" y2="542" class="slowing"/><text x="66" y="546" class="label">Slowing</text><text x="316" y="546" class="label" text-anchor="end">1.8M×</text>
  <line x1="24" y1="568" x2="54" y2="568" class="plateau"/><text x="66" y="572" class="label">Plateau</text><text x="316" y="572" class="label" text-anchor="end">10K×</text>
  <text x="170" y="604" class="note" text-anchor="middle">Five-Year PhD · Roughly $300K</text>
  <text x="170" y="624" class="note" text-anchor="middle">Historical cost trend [3] · Illustrative scenarios</text>
</svg>
