<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="616" viewBox="0 0 800 308" role="img" aria-labelledby="title desc">
  <title id="title">A computational world containing simulated galaxies beside a star</title>
  <desc id="desc">A vast translucent computing structure holds luminous galaxies while a nearby sun rises over a quiet alien landscape.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020814" stop-opacity="0.22"/>
      <stop offset="0.62" stop-color="#08111f" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f1b56c" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#95ddff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000713" stop-opacity="0.20"/>
    </linearGradient>
  </defs>
  <image width="800" height="308" href="data:image/webp;base64," preserveAspectRatio="xMidYMid slice"/>
  <rect width="800" height="308" fill="url(#shade)"/>
  <rect width="800" height="308" fill="url(#edge)"/>
</svg>
