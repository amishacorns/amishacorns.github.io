<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">From Apprentice Hierarchy to Agent Hierarchy</title>
  <desc id="desc">A traditional research group routes a research direction through a professor and graduate researchers. An agentic research group routes the same direction through a lead model and specialized agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101014"/><stop offset="1" stop-color="#070708"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.title{fill:#f8fafc;font-size:25px;font-weight:600}.sub{fill:#94a3b8;font-size:15px}.era{fill:#a78bfa;font-size:13px;font-weight:700;letter-spacing:.08em}.node-title{fill:#fff;font-size:17px;font-weight:650;text-anchor:middle}.node-sub{fill:#d8dce7;font-size:13px;text-anchor:middle}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="588" rx="24" fill="url(#bg)" stroke="#fff" stroke-opacity=".12"/>
  <text x="42" y="52" class="title">From Apprentice Hierarchy to Agent Hierarchy</text>
  <text x="42" y="77" class="sub">The organizational structure survives when the labor becomes software.</text>

  <text x="42" y="119" class="era">Human Research Group</text>
  <text x="412" y="119" class="era">Agentic Research Group</text>
  <line x1="380" y1="105" x2="380" y2="542" stroke="#fff" stroke-opacity=".12"/>

  <rect x="82" y="142" width="256" height="62" rx="13" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".2"/>
  <text x="210" y="169" class="node-title">Research Direction</text><text x="210" y="190" class="node-sub">A problem worth pursuing</text>
  <path d="M210 204V235" class="arrow"/>
  <rect x="82" y="240" width="256" height="68" rx="13" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".2"/>
  <text x="210" y="268" class="node-title">Professor</text><text x="210" y="290" class="node-sub">Selects and supervises</text>
  <path d="M210 308V339" class="arrow"/>
  <rect x="82" y="344" width="256" height="76" rx="13" fill="url(#accent)"/>
  <text x="210" y="375" class="node-title">Graduate Researchers</text><text x="210" y="398" class="node-sub">Execute and coordinate</text>
  <path d="M210 420V451" class="arrow"/>
  <rect x="82" y="456" width="256" height="68" rx="13" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".2"/>
  <text x="210" y="484" class="node-title">Parallel Projects</text><text x="210" y="506" class="node-sub">Bound by trained headcount</text>

  <rect x="422" y="142" width="256" height="62" rx="13" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".2"/>
  <text x="550" y="169" class="node-title">Research Direction</text><text x="550" y="190" class="node-sub">A problem worth pursuing</text>
  <path d="M550 204V235" class="arrow"/>
  <rect x="422" y="240" width="256" height="68" rx="13" fill="url(#accent)"/>
  <text x="550" y="268" class="node-title">Lead Model</text><text x="550" y="290" class="node-sub">Decomposes and supervises</text>
  <path d="M550 308V339" class="arrow"/>
  <rect x="422" y="344" width="256" height="76" rx="13" fill="url(#accent)"/>
  <text x="550" y="375" class="node-title">Specialized Agents</text><text x="550" y="398" class="node-sub">Execute, check, and reproduce</text>
  <path d="M550 420V451" class="arrow"/>
  <rect x="422" y="456" width="256" height="68" rx="13" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".2"/>
  <text x="550" y="484" class="node-title">Parallel Projects</text><text x="550" y="506" class="node-sub">Bound by inference and compute</text>

  <text x="380" y="560" class="sub" text-anchor="middle">The scarce execution layer moves from trained people to machine intelligence.</text>
</svg>
